<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bukti Pembayaran Angsuran - Nina I Fix ID</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f3efe6;
  color:#222;
  font-family:Arial,sans-serif;
}
.app{
  max-width:480px;
  margin:auto;
  padding:20px 16px 50px;
}
h1{font-size:21px;margin:0 0 5px}
.sub{font-size:12px;color:#777;margin-bottom:22px}
.card{
  background:#fff;
  border:1px solid #ddd5c5;
  border-radius:8px;
  padding:16px;
}
label{
  display:block;
  font-size:12px;
  font-weight:bold;
  margin:0 0 6px;
}
input,select{
  width:100%;
  padding:11px;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:14px;
  margin-bottom:13px;
}
.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
button{
  width:100%;
  border:0;
  border-radius:6px;
  padding:13px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  margin-top:7px;
}
.btn-print{background:#222;color:#fff}
.btn-browser{background:#fff;border:1px solid #ccc}
.preview-title{
  margin:22px 0 10px;
  font-size:12px;
  font-weight:bold;
  color:#777;
}
.receipt{
  width:58mm;
  min-height:80mm;
  margin:auto;
  background:#fff;
  padding:5mm 4mm;
  font-family:"Courier New",monospace;
  font-size:11px;
  line-height:1.4;
  box-shadow:0 2px 10px rgba(0,0,0,.12);
}
.center{text-align:center}
.bold{font-weight:bold}
.line{
  border-top:1px dashed #222;
  margin:7px 0;
}
.row-receipt{
  display:flex;
  justify-content:space-between;
  gap:8px;
}
.small{font-size:10px}
.space{height:9px}
@media print{
  @page{
    size:58mm auto;
    margin:0;
  }
  body{background:#fff}
  body *{visibility:hidden}
  #receipt,#receipt *{visibility:visible}
  #receipt{
    position:absolute;
    left:0;
    top:0;
    width:58mm;
    box-shadow:none;
    margin:0;
  }
}
</style>
</head>

<body>
<div class="app">

  <h1>NINA I FIX ID</h1>
  <div class="sub">Bukti Pembayaran Angsuran</div>

  <div class="card">
    <label>Jenis Transaksi</label>
    <select id="jenis" onchange="render()">
      <option value="gadai">NINA GADAI</option>
      <option value="cicilan">NINA-PAY</option>
    </select>

    <label>Nama Pelanggan / Nasabah</label>
    <input id="nama" placeholder="Nama pelanggan" oninput="render()">

    <label>Barang</label>
    <input id="barang" placeholder="Contoh: iPhone 15" oninput="render()">

    <div class="row">
      <div>
        <label>Angsuran Ke-</label>
        <input id="angsuran" type="number" min="1" value="1" oninput="render()">
      </div>
      <div>
        <label>Tanggal</label>
        <input id="tanggal" type="date" onchange="render()">
      </div>
    </div>

    <label>Jumlah Pembayaran</label>
    <input id="jumlah" type="number" placeholder="500000" oninput="render()">

    <label>Sisa Pinjaman / Sisa Cicilan</label>
    <input id="sisa" type="number" placeholder="0" oninput="render()">

    <label>Catatan (opsional)</label>
    <input id="catatan" placeholder="Contoh: Dibayar tunai" oninput="render()">

    <button class="btn-print" onclick="printReceipt()">🖨️ Cetak Bukti Pembayaran</button>
    <button class="btn-browser" onclick="window.print()">Cetak via Browser</button>
  </div>

  <div class="preview-title">PREVIEW KERTAS 58MM</div>

  <div id="receipt" class="receipt"></div>

</div>

<script>
function rupiah(n){
  n=Math.round(Number(n)||0);
  return "Rp "+n.toLocaleString("id-ID");
}

function tglID(v){
  if(!v)return "-";
  const [y,m,d]=v.split("-");
  return d+"/"+m+"/"+y;
}

function today(){
  const d=new Date();
  return d.toISOString().slice(0,10);
}

document.getElementById("tanggal").value=today();

function render(){
  const jenis=document.getElementById("jenis").value;
  const nama=document.getElementById("nama").value || "-";
  const barang=document.getElementById("barang").value || "-";
  const angsuran=document.getElementById("angsuran").value || "1";
  const tanggal=document.getElementById("tanggal").value;
  const jumlah=document.getElementById("jumlah").value;
  const sisa=document.getElementById("sisa").value;
  const catatan=document.getElementById("catatan").value;

  const judul=jenis==="gadai" ? "NINA GADAI" : "NINA-PAY";
  const subjudul=jenis==="gadai"
    ? "BUKTI PEMBAYARAN ANGSURAN"
    : "BUKTI PEMBAYARAN CICILAN";

  let html="";
  html+=`<div class="center bold">NINA I FIX ID</div>`;
  html+=`<div class="center small">Cipedang, Bongas</div>`;
  html+=`<div class="center small">Indramayu, Jawa Barat</div>`;
  html+=`<div class="center small">WA 085717978783</div>`;
  html+=`<div class="line"></div>`;
  html+=`<div class="center bold">${judul}</div>`;
  html+=`<div class="center">${subjudul}</div>`;
  html+=`<div class="line"></div>`;

  html+=`<div class="row-receipt"><span>Tanggal</span><span>${tglID(tanggal)}</span></div>`;
  html+=`<div>Nama : ${nama}</div>`;
  html+=`<div>Barang : ${barang}</div>`;

  html+=`<div class="line"></div>`;
  html+=`<div class="center bold">ANGSURAN KE-${angsuran}</div>`;
  html+=`<div class="space"></div>`;

  html+=`<div class="row-receipt bold"><span>Dibayar</span><span>${rupiah(jumlah)}</span></div>`;
  html+=`<div class="row-receipt"><span>Sisa</span><span>${rupiah(sisa)}</span></div>`;

  if(catatan){
    html+=`<div class="line"></div>`;
    html+=`<div>Catatan:</div>`;
    html+=`<div>${catatan}</div>`;
  }

  html+=`<div class="line"></div>`;
  html+=`<div class="center bold">PEMBAYARAN DITERIMA</div>`;
  html+=`<div class="center small">Simpan bukti ini sebagai tanda</div>`;
  html+=`<div class="center small">pembayaran angsuran.</div>`;
  html+=`<div class="space"></div>`;
  html+=`<div class="row-receipt small"><span>Petugas</span><span>__________</span></div>`;
  html+=`<div class="space"></div>`;

  document.getElementById("receipt").innerHTML=html;
}

function printReceipt(){
  render();
  window.print();
}

render();
</script>
</body>
</html>
