<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NINA - Bukti Angsuran</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eee;font-family:Arial,sans-serif;color:#222}
.app{max-width:430px;margin:auto;padding:15px}
h2{margin:5px 0;font-size:20px}
p{font-size:12px;color:#666}
.card{background:#fff;padding:15px;border-radius:8px}
label{display:block;font-size:12px;font-weight:bold;margin:10px 0 5px}
input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:5px;font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{width:100%;padding:13px;margin-top:14px;border:0;border-radius:6px;font-size:15px;font-weight:bold;cursor:pointer}
.print{background:#222;color:#fff}
.note{font-size:11px;text-align:center;margin-top:10px}

#receipt{
  width:58mm;
  background:#fff;
  margin:20px auto;
  padding:4mm 3.5mm;
  font-family:"Courier New",monospace;
  font-size:11px;
  line-height:1.35;
}
.center{text-align:center}
.bold{font-weight:bold}
.line{border-top:1px dashed #000;margin:6px 0}
.flex{display:flex;justify-content:space-between}
.big{font-size:14px;font-weight:bold}
@media print{
  @page{size:58mm auto;margin:0}
  html,body{width:58mm;margin:0;padding:0;background:#fff}
  .app{display:none!important}
  #receipt{
    display:block!important;
    width:58mm;
    margin:0;
    padding:4mm 3.5mm;
  }
}
</style>
</head>
<body>

<div class="app">
  <h2>NINA I FIX ID</h2>
  <p>Bukti pembayaran angsuran — printer Bluetooth thermal 58mm</p>

  <div class="card">
    <label>Jenis</label>
    <select id="jenis" onchange="render()">
      <option>NINA GADAI</option>
      <option>NINA-PAY</option>
    </select>

    <label>Nama Nasabah / Pelanggan</label>
    <input id="nama" placeholder="Nama" oninput="render()">

    <label>Barang</label>
    <input id="barang" placeholder="Contoh: iPhone 15" oninput="render()">

    <div class="row">
      <div>
        <label>Angsuran Ke-</label>
        <input id="ke" type="number" min="1" value="1" oninput="render()">
      </div>
      <div>
        <label>Tanggal</label>
        <input id="tanggal" type="date" oninput="render()">
      </div>
    </div>

    <label>Jumlah Dibayar</label>
    <input id="jumlah" type="number" placeholder="500000" oninput="render()">

    <label>Sisa Pinjaman / Cicilan</label>
    <input id="sisa" type="number" placeholder="0" oninput="render()">

    <label>Catatan</label>
    <input id="catatan" placeholder="Opsional" oninput="render()">

    <button class="print" onclick="cetak()">🖨️ CETAK</button>
    <div class="note">Pastikan printer Bluetooth 58mm sudah tersambung ke HP.</div>
  </div>
</div>

<div id="receipt"></div>

<script>
function rp(n){
  return "Rp "+(Number(n)||0).toLocaleString("id-ID");
}
function tanggalID(v){
  if(!v)return "-";
  let a=v.split("-");
  return a[2]+"/"+a[1]+"/"+a[0];
}
function render(){
  let jenis=document.getElementById("jenis").value;
  let nama=document.getElementById("nama").value||"-";
  let barang=document.getElementById("barang").value||"-";
  let ke=document.getElementById("ke").value||"1";
  let tgl=document.getElementById("tanggal").value;
  let jumlah=document.getElementById("jumlah").value;
  let sisa=document.getElementById("sisa").value;
  let catatan=document.getElementById("catatan").value;

  document.getElementById("receipt").innerHTML=`
    <div class="center bold">NINA I FIX ID</div>
    <div class="center">Cipedang, Bongas</div>
    <div class="center">Indramayu, Jawa Barat</div>
    <div class="center">WA 085717978783</div>

    <div class="line"></div>

    <div class="center bold">${jenis}</div>
    <div class="center">BUKTI PEMBAYARAN</div>

    <div class="line"></div>

    <div class="flex"><span>Tanggal</span><span>${tanggalID(tgl)}</span></div>
    <div>Nama : ${nama}</div>
    <div>Barang : ${barang}</div>

    <div class="line"></div>

    <div class="center big">ANGSURAN KE-${ke}</div>

    <div class="line"></div>

    <div class="flex bold">
      <span>DIBAYAR</span>
      <span>${rp(jumlah)}</span>
    </div>
    <div class="flex">
      <span>Sisa</span>
      <span>${rp(sisa)}</span>
    </div>

    ${catatan ? `<div class="line"><\/div><div>Catatan:</div><div>${catatan}</div>` : ""}

    <div class="line"></div>

    <div class="center bold">PEMBAYARAN DITERIMA</div>
    <div class="center">Simpan sebagai bukti pembayaran</div>

    <br>
    <div class="flex"><span>Petugas</span><span>________</span></div>
    <br>
    <div class="center">Terima kasih</div>
  `;
}

function cetak(){
  render();
  window.print();
}

document.getElementById("tanggal").value=new Date().toISOString().slice(0,10);
render();
</script>

</body>
</html>
